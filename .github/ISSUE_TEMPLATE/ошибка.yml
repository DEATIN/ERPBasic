name: Ошибка в работе
description: Сообщить о воспроизводимой ошибке интерфейса или расчётов
title: "Ошибка: "
body:
  - type: markdown
    attributes:
      value: Опишите проблему на русском языке. Используйте вымышленные данные.
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Какую страницу и документ нужно открыть, что сделать?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Браузер, устройство и версия
  - type: textarea
    id: evidence
    attributes:
      label: Снимки экрана и дополнительные сведения
      description: Не прикладывайте рабочие резервные копии и персональные данные.
