name: Проверка и публикация ERP Basic

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-basic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proverka:
    name: Проверка интерфейса и учёта
    runs-on: ubuntu-24.04
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Подготовить Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Проверить JavaScript
        run: npm run проверка
      - name: Проверить учётные сценарии
        run: npm run тесты
      - name: Проверить сборку выпуска
        run: python3 инструменты/сборка-выпуска.py --version ci --output "$RUNNER_TEMP/erp-release-check"
      - name: Подготовить артефакт страницы
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
          # Сохраняем .nojekyll: новая версия действия исключает скрытые файлы по умолчанию.
          include-hidden-files: true

  publikaciya:
    name: Опубликовать демонстрацию
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: proverka
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Опубликовать страницу
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
