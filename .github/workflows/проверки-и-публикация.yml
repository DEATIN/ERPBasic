name: Проверка и публикация ERP Basic

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-basic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proverka:
    name: Проверка интерфейса и учёта
    runs-on: ubuntu-24.04
    steps:
      - name: Получить исходники
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Подготовить Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Проверить JavaScript
        run: npm run проверка
      - name: Проверить учётные сценарии
        run: npm run тесты
      - name: Подготовить страницу
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

  publikaciya:
    name: Опубликовать демонстрацию
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: proverka
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Опубликовать страницу
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
