[project]
name = "erp_basic"
description = "Серверное приложение ERP Basic для Frappe и ERPNext"
authors = [{name = "ERP Basic"}]
requires-python = ">=3.10,<3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.126.0,<16.0.0"
erpnext = ">=15.124.5,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
